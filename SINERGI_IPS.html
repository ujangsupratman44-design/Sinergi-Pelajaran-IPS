<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SINERGI IPS — Sistem Informasi, Eksplorasi, dan Riset Generasi Inovatif</title>
<style>
:root{--navy:#7d1020;--blue:#c8102e;--sky:#fff2f3;--gold:#ffffff;--ink:#29252a;--muted:#74676a;--white:#fff;--green:#18845b;--red:#c8102e}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f7fb;color:var(--ink)}
header{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(120deg,#b80020 0%,#d71936 48%,#a9001d 100%);color:#fff;padding:24px max(18px,calc((100% - 1100px)/2));display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:4px solid #790016;box-shadow:0 6px 22px #74111a28}
.flag-waves{position:absolute;z-index:0;inset:0;width:100%;height:100%;min-height:150px;pointer-events:none;opacity:.13}.brand{display:flex;align-items:center;gap:12px;position:relative;z-index:2;max-width:720px}.logo{width:54px;height:54px;border-radius:16px;background:linear-gradient(145deg,#fff,#ffe9ed);color:#b80020;display:grid;place-items:center;font-weight:900;font-size:21px;box-shadow:0 5px 14px #65001444;border:2px solid #fff;flex:0 0 auto}.globe-spin{width:54px;height:54px;display:block;flex:0 0 auto;filter:drop-shadow(0 3px 5px #65001455);animation:globeRotate 12s linear infinite;transform-origin:50% 50%}@keyframes globeRotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.globe-spin{animation:none}}.brand h1{font-size:clamp(20px,3vw,29px);margin:0;color:#fff;letter-spacing:.5px;text-shadow:0 2px 5px #65001488}.brand p{margin:5px 0 0;color:#fff;font-size:13px;font-weight:700;max-width:520px;text-shadow:0 1px 3px #65001466}.header-map{position:absolute;z-index:1;right:16%;top:0;width:min(38vw,430px);height:100%;min-height:140px;opacity:.28;pointer-events:none}.header-map path,.header-map ellipse{fill:#fff;stroke:#ffdce2;stroke-width:1.4}.header-map .map-line{fill:none;stroke:#fff;stroke-width:2;stroke-dasharray:4 5;opacity:.9}header>div:last-child{position:relative;z-index:2}
header button{background:#fff;color:#a9001d;border:0;border-radius:10px;padding:10px 14px;font-weight:bold;cursor:pointer;box-shadow:0 3px 10px #65001433}
.header-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.header-actions button.backup-btn{background:#fff;color:#a9001d;border:1px solid #ffe0e5}.save-status{font-size:12px;color:#fff;margin-top:5px;text-align:right}
.map-banner{background:linear-gradient(135deg,#fff,#fff5f6);padding:10px 18px 0;text-align:center}
.map-banner svg{display:block;width:min(100%,760px);height:105px;margin:0 auto}
.map-caption{font-size:11px;color:#a30d24;letter-spacing:2px;font-weight:800;padding-bottom:10px}
main{max-width:1100px;margin:24px auto;padding:0 18px 45px}.welcome{background:white;border-radius:18px;padding:0;box-shadow:0 5px 20px #173b5b0d;margin-bottom:18px;overflow:hidden;display:grid;grid-template-columns:1.05fr .95fr;align-items:stretch}.welcome-copy{padding:28px;align-self:center}.welcome h2{margin:0 0 10px;color:var(--navy);font-size:clamp(23px,3vw,34px)}.welcome p{margin:0;color:var(--muted);line-height:1.6}.welcome-art{width:100%;height:100%;min-height:260px;object-fit:cover;display:block}.login-panel{max-width:520px;margin:18px auto;padding:24px}.login-panel h2{text-align:center;margin-bottom:18px}.login-panel .formrow{margin:14px 0}.login-panel .btn{width:100%;padding:13px}.login-panel .actions{margin-top:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.tile{background:white;border:1px solid #e1eaf2;border-radius:16px;padding:20px;cursor:pointer;text-align:left;transition:.15s;box-shadow:0 4px 16px #173b5b08}.tile:hover{transform:translateY(-2px);border-color:#e8798b}.tile .emoji{font-size:28px}.tile h3{margin:12px 0 6px;color:var(--navy)}.tile p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.panel{background:white;border-radius:16px;padding:22px;margin-top:18px;box-shadow:0 5px 20px #173b5b0d}.panel h2,.panel h3{color:var(--navy);margin-top:0}.hidden{display:none!important}.formrow{display:grid;gap:6px;margin:12px 0}.formrow label{font-size:14px;font-weight:bold}.formrow input,.formrow select,.formrow textarea{width:100%;padding:12px;border:1px solid #cbd8e4;border-radius:9px;font:inherit;background:white}.btn{border:0;border-radius:9px;background:var(--blue);color:white;padding:11px 15px;font-weight:bold;cursor:pointer}.btn.secondary{background:#e7f2fc;color:var(--navy)}.btn.danger{background:var(--red)}.btn.green{background:var(--green)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.notice{padding:12px 14px;background:var(--sky);border-radius:10px;color:var(--navy);font-size:14px;line-height:1.5;margin:12px 0}.status{font-weight:bold;font-size:13px;color:var(--green)}.subject-head{display:flex;align-items:center;gap:12px}.subject-head .emoji{font-size:36px}.subject-head h2{margin:0}.subject-head p{margin:5px 0;color:var(--muted)}
.question{border:1px solid #e0e8f0;border-radius:12px;padding:15px;margin:12px 0}.question p{font-weight:bold;margin-top:0}.option{display:block;padding:8px 0;font-weight:normal!important}.option input{margin-right:8px}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}th,td{text-align:left;border-bottom:1px solid #e5edf4;padding:11px 9px}th{background:#f0f6fb;color:var(--navy)}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:#e5f6ee;color:#176747;font-size:12px;font-weight:bold}.muted{color:var(--muted);font-size:14px}.empty{color:var(--muted);padding:14px 0}
footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
@media(max-width:600px){header{padding:18px}.flag-waves{opacity:.9}.header-map{right:0;left:auto;width:68vw;opacity:.13}.welcome{grid-template-columns:1fr}.welcome-copy{padding:20px}.welcome-art{min-height:190px;max-height:250px;grid-row:2}.panel{padding:17px}.login-panel{padding:20px}main{margin-top:15px}.tile{padding:16px}}

.file-list{display:grid;gap:9px;margin:12px 0}.file-item{border:1px solid #dce7f0;border-radius:10px;padding:11px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.file-item a{overflow-wrap:anywhere}.small-btn{padding:7px 10px;font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.pill-note{font-size:12px;color:var(--muted)}.inline-form{border:1px solid #dce7f0;border-radius:12px;padding:15px;margin:14px 0;background:#fbfdff}

.material-viewer{position:fixed;inset:0;background:rgba(20,18,20,.78);z-index:9999;display:none;align-items:center;justify-content:center;padding:16px}
.material-viewer.open{display:flex}.viewer-card{background:#fff;width:min(1100px,100%);height:min(92vh,900px);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 70px #0005}
.viewer-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid #eadde0;flex-wrap:wrap}.viewer-head h3{margin:0;color:var(--navy);overflow-wrap:anywhere}.viewer-actions{display:flex;gap:8px;flex-wrap:wrap}.viewer-body{flex:1;min-height:0;overflow:auto;background:#f5f5f5;padding:12px}.viewer-body iframe{width:100%;height:100%;min-height:60vh;border:0;background:white}.viewer-body img{display:block;max-width:100%;max-height:100%;height:auto;margin:auto;object-fit:contain}.viewer-body pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:20px;border-radius:8px;font:15px/1.65 Arial,sans-serif}.viewer-hint{font-size:13px;color:#66585c;margin:0 0 10px}.viewer-body audio,.viewer-body video{width:100%;max-height:75vh}
@media(max-width:600px){.material-viewer{padding:5px}.viewer-card{height:96vh}.viewer-head{padding:10px}.viewer-body{padding:7px}}


.attendance-nav{margin:12px 0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.tile{cursor:pointer;text-align:left;border:1px solid #d9e2ec;border-radius:12px;padding:16px;background:#fff;color:#243447;box-shadow:0 2px 8px #0000000a}.tile h3{margin:8px 0}.tile p{margin:6px 0 12px}.tile .emoji{font-size:26px}
</style>
</head>

// Fitur pencadangan/pemulihan data. Data tetap disimpan di browser ini; file cadangan dapat dipindahkan ke perangkat lain.
function readBlobAsBase64(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]||'');reader.onerror=()=>reject(reader.error||new Error('Gagal membaca berkas'));reader.readAsDataURL(blob);});}
function base64ToBlob(base64,type){const raw=atob(base64),parts=[];for(let i=0;i<raw.length;i+=1024){const slice=raw.slice(i,i+1024),nums=new Array(slice.length);for(let j=0;j<slice.length;j++)nums[j]=slice.charCodeAt(j);parts.push(new Uint8Array(nums));}return new Blob(parts,{type:type||'application/octet-stream'});}
async function backupAllData(){if(!currentUser||currentUser.role!=='guru'){alert('Hanya guru yang dapat mencadangkan data.');return;}try{const local={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k)local[k]=localStorage.getItem(k);}const db=await openMaterialDB();const records=await new Promise((resolve,reject)=>{const tx=db.transaction(MATERIAL_STORE,'readonly'),req=tx.objectStore(MATERIAL_STORE).getAll();req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});db.close();const serialized=[];for(const item of records){const copy={...item};for(const field of ['blob','data']){if(copy[field] instanceof Blob){copy[field]={__backupBlob:true,type:copy[field].type||'application/octet-stream',name:copy[field].name||'',lastModified:copy[field].lastModified||null,base64:await readBlobAsBase64(copy[field])};}}serialized.push(copy);}const backup={app:'SINERGI IPS',formatVersion:1,createdAt:new Date().toISOString(),localStorage:local,indexedDB:serialized};const blob=new Blob([JSON.stringify(backup)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='cadangan-sinergi-ips-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);alert('Cadangan berhasil dibuat. Simpan file JSON ini di tempat aman.');}catch(err){console.error(err);alert('Pencadangan gagal: '+(err.message||err));}}
async function restoreAllData(event){if(!currentUser||currentUser.role!=='guru'){alert('Hanya guru yang dapat memulihkan data.');return;}const file=event.target.files&&event.target.files[0];if(!file)return;if(file.size>150*1024*1024){alert('File cadangan terlalu besar (maksimal 150 MB).');event.target.value='';return;}if(!confirm('Pemulihan akan menggabungkan data cadangan dengan data di browser ini. Buat cadangan terbaru terlebih dahulu. Lanjutkan?')){event.target.value='';return;}try{const backup=JSON.parse(await file.text());if(backup.app!=='SINERGI IPS'||!backup.localStorage||!Array.isArray(backup.indexedDB))throw new Error('Format file bukan cadangan SINERGI IPS yang valid.');for(const [k,v] of Object.entries(backup.localStorage))localStorage.setItem(k,v);const db=await openMaterialDB();await new Promise((resolve,reject)=>{const tx=db.transaction(MATERIAL_STORE,'readwrite'),store=tx.objectStore(MATERIAL_STORE);for(const original of backup.indexedDB){const item={...original};for(const field of ['blob','data']){const v=item[field];if(v&&v.__backupBlob){const b=base64ToBlob(v.base64,v.type);item[field]=v.name?new File([b],v.name,{type:v.type,lastModified:v.lastModified||Date.now()}):b;}}store.put(item);}tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('Gagal memulihkan basis data'));tx.onabort=()=>reject(tx.error||new Error('Pemulihan dibatalkan'));});db.close();alert('Data cadangan berhasil dipulihkan. Halaman akan dimuat ulang agar semua perubahan terlihat.');location.reload();}catch(err){console.error(err);alert('Pemulihan gagal: '+(err.message||err));}finally{event.target.value='';}}

// Penyimpanan bahan ajar memakai IndexedDB agar lebih andal untuk berkas.
const MATERIAL_DB='LaboratoriumIPSDB', MATERIAL_STORE='materials';
function openMaterialDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('Browser tidak mendukung IndexedDB'));return;}const req=indexedDB.open(MATERIAL_DB,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(MATERIAL_STORE))db.createObjectStore(MATERIAL_STORE,{keyPath:'key'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('Gagal membuka penyimpanan bahan ajar'));});}
async function getMaterials(key){
 let dbItems=[];
 try{const db=await openMaterialDB();dbItems=await new Promise((resolve,reject)=>{const tx=db.transaction(MATERIAL_STORE,'readonly'),req=tx.objectStore(MATERIAL_STORE).getAll();req.onsuccess=()=>resolve(req.result.filter(x=>x.subject===key));req.onerror=()=>reject(req.error);});db.close();}catch(err){console.warn('IndexedDB tidak tersedia:',err);}
 let legacy=[];try{legacy=JSON.parse(localStorage.getItem('ips_materials_'+key)||'[]');}catch(e){}
 const known=new Set(dbItems.map(x=>x.id));
 for(const f of legacy.filter(x=>!known.has(x.id))){const item={...f,key:key+':'+f.id,subject:key};try{const db=await openMaterialDB();await new Promise((resolve,reject)=>{const tx=db.transaction(MATERIAL_STORE,'readwrite');tx.objectStore(MATERIAL_STORE).put(item);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});db.close();dbItems.push(item);}catch(e){dbItems.push(item);}}
 return dbItems.length?dbItems:legacy;
}
async function saveMaterial(key,item){const db=await openMaterialDB();await new Promise((resolve,reject)=>{const tx=db.transaction(MATERIAL_STORE,'readwrite');tx.objectStore(MATERIAL_STORE).put({...item,key:key+':'+item.id,subject:key});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('Gagal menyimpan berkas'));});db.close();}
async function removeMaterial(key,id){try{const db=await openMaterialDB();await new Promise((resolve,reject)=>{const tx=db.transaction(MATERIAL_STORE,'readwrite');tx.objectStore(MATERIAL_STORE).delete(key+':'+id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});db.close();}catch(e){console.warn(e);}try{localStorage.setItem('ips_materials_'+key,JSON.stringify(JSON.parse(localStorage.getItem('ips_materials_'+key)||'[]').filter(f=>f.id!==id)));}catch(e){}}

function saveSubjectDesc(key){const s=subjects[key],old=JSON.parse(localStorage.getItem('ips_subject_content_'+key)||'null');const data=old||{topics:s.topics,desc:s.desc};data.desc=$('subjectDesc').value.trim()||s.desc;localStorage.setItem('ips_subject_content_'+key,JSON.stringify(data));openSubject(key);}
function addTopic(key){const value=$('newTopic').value.trim();if(!value){alert('Isi judul topik terlebih dahulu.');return;}const s=subjects[key],data=JSON.parse(localStorage.getItem('ips_subject_content_'+key)||'null')||{topics:s.topics.slice(),desc:s.desc};data.topics.push(value);localStorage.setItem('ips_subject_content_'+key,JSON.stringify(data));openSubject(key);}

function deleteTopic(key,index){if(!confirm('Hapus topik ini?'))return;const s=subjects[key],data=JSON.parse(localStorage.getItem('ips_subject_content_'+key)||'null')||{topics:s.topics.slice(),desc:s.desc};data.topics.splice(index,1);localStorage.setItem('ips_subject_content_'+key,JSON.stringify(data));openSubject(key);}
async function uploadMaterials(key){
 const input=$('materialUpload'),files=Array.from(input.files||[]);
 if(!files.length){alert('Pilih minimal satu berkas.');return;}
 const button=Array.from(document.querySelectorAll('#contentPanel button')).find(b=>b.textContent.includes('Upload Bahan Ajar'));
 if(button){button.disabled=true;button.textContent='Menyimpan…';}
 let added=0,failed=[];
 try{
  for(const file of files){
   if(file.size>25*1024*1024){failed.push(file.name+' (lebih dari 25 MB)');continue;}
   const id=Date.now().toString(36)+Math.random().toString(36).slice(2,9);
   const topicIndex=Number(($('materialTopic')||{}).value||0);
   const topicList=getSubjectTopics(key);
   try{await saveMaterial(key,{id,name:file.name,type:file.type||'application/octet-stream',size:file.size,data:file,topicIndex,topicName:topicList[topicIndex]||'Materi umum'});added++;}
   catch(err){failed.push(file.name+' (gagal disimpan: '+(err.message||'penyimpanan penuh')+')');}
  }
  input.value='';await openTopicMaterials(key,Number(($('materialTopic')||{}).value||0));
  let msg=added+' berkas berhasil disimpan pada topik pilihan.';
  if(failed.length)msg+='\\nBerkas yang tidak tersimpan: '+failed.join(', ')+'.';
  alert(msg);
 }catch(err){alert('Berkas belum dapat disimpan. Pastikan penyimpanan situs diizinkan. Detail: '+(err.message||err));}
 finally{if(button){button.disabled=false;button.textContent='Upload Bahan Ajar';}}
}
function getSubjectTopics(key){const s=subjects[key],saved=JSON.parse(localStorage.getItem('ips_subject_content_'+key)||'null');return saved&&Array.isArray(saved.topics)?saved.topics:s.topics;}
async function openTopicMaterials(key,index){
 const panel=$('topicMaterialsPanel');if(!panel)return;
 const topics=getSubjectTopics(key),title=topics[index]||'Topik pembelajaran';
 panel.innerHTML=`<div class="panel" style="margin:16px 0;padding:16px"><h3>📘 ${escapeHtml(title)}</h3><p class="muted">Bahan ajar untuk topik ini. Klik nama berkas untuk membacanya.</p><div id="materialsList" class="file-list"></div></div>`;
 await renderMaterials(key,index);
 panel.scrollIntoView({behavior:'smooth',block:'start'});
}
async function renderMaterials(key,topicIndex=null){
 const box=$('materialsList');if(!box)return;box.innerHTML='<p class="empty">Memuat bahan ajar…</p>';
 const arr=await getMaterials(key);if(!document.getElementById('materialsList'))return;
 const shown=topicIndex===null?arr:arr.filter(f=>Number.isInteger(f.topicIndex)?f.topicIndex===topicIndex: true);
 if(!shown.length){box.innerHTML='<p class="empty">Belum ada bahan ajar pada topik ini. Guru dapat mengunggah bahan ajar melalui formulir kelola materi.</p>';return;}
 box.innerHTML=shown.map(f=>`<div class="file-item"><div style="flex:1"><b>${escapeHtml(f.name)}</b><div class="pill-note">${Math.max(1,Math.round((f.size||0)/1024))} KB${f.topicName?' · '+escapeHtml(f.topicName):' · Materi lama (belum ditautkan ke topik)'}</div></div><div class="actions"><button class="btn secondary small-btn" onclick="openMaterialFile('${key}','${f.id}')">Baca materi</button>${currentUser&&currentUser.role==='guru'?`<button class="btn danger small-btn" onclick="deleteMaterial('${key}','${f.id}',${topicIndex===null?'null':topicIndex})">Hapus</button>`:''}</div></div>`).join('');
}

  if(ext==='csv'){const lines=(await file.text()).replace(/^\\uFEFF/,'').split(/\\r?\\n/).filter(x=>x.trim());rows=lines.map(line=>line.split(',').map(x=>x.trim().replace(/^"|"$/g,'')));}
  else{if(!window.XLSX)throw new Error('Pembaca Excel belum tersedia. Pastikan internet aktif.');const wb=XLSX.read(new Uint8Array(await file.arrayBuffer()),{type:'array',cellDates:true});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:true});}

   if(found>=0){records[found]={...records[found],...item};updated++;}else{records.push(item);added++;}

async function importAttendanceRoster(){if(!currentUser||currentUser.role!=='guru'){alert('Hanya guru yang dapat memuat daftar siswa.');return;}const input=$('attendanceRosterFile'),file=input&&input.files&&input.files[0];if(!file){alert('Pilih file daftar siswa terlebih dahulu.');return;}const ext=file.name.split('.').pop().toLowerCase(),fallbackClass=$('rosterDefaultClass').value.trim();let rows=[];

  const chosenClass=window.attendanceReportClass||'Semua kelas';
  const allRecords=getAttendance().filter(x=>String(x.date||'').slice(0,7)===monthValue&&(chosenClass==='Semua kelas'||String(x.klass||'Belum ditentukan')===chosenClass));
  const classes=[...new Set([...roster.map(s=>String(s.klass||'Belum ditentukan')),...getAttendance().map(x=>String(x.klass||'Belum ditentukan'))])].sort((a,b)=>a.localeCompare(b,'id'));
  const statusList=['Hadir','Sakit','Izin','Alpa','Bolos'];
  const studentKeys=new Map();
  roster.forEach(s=>studentKeys.set((String(s.name).toLowerCase()+'|'+String(s.klass)),{name:s.name,klass:String(s.klass||'Belum ditentukan')}));
  allRecords.forEach(r=>studentKeys.set((String(r.name).toLowerCase()+'|'+String(r.klass)),{name:r.name,klass:String(r.klass||'Belum ditentukan')}));
  const rows=[...studentKeys.values()].filter(s=>chosenClass==='Semua kelas'||s.klass===chosenClass).map(s=>{const recs=allRecords.filter(r=>String(r.name).toLowerCase()===String(s.name).toLowerCase()&&String(r.klass||'Belum ditentukan')===s.klass);const c={};statusList.forEach(st=>c[st]=recs.filter(r=>r.status===st).length);return {...s,...c,totalAbsen:c.Sakit+c.Izin+c.Alpa+c.Bolos};}).sort((a,b)=>a.klass.localeCompare(b.klass,'id')||a.name.localeCompare(b.name,'id'));
  const totals=rows.reduce((a,r)=>{statusList.forEach(st=>a[st]+=r[st]);a.totalAbsen+=r.totalAbsen;return a;},{Hadir:0,Sakit:0,Izin:0,Alpa:0,Bolos:0,totalAbsen:0});
  box.innerHTML=`<div class="inline-form"><h3>Rekap Absensi Bulanan</h3><div class="grid"><div class="formrow"><label for="rekapMonth">Bulan rekap</label><input id="rekapMonth" type="month" value="${escapeHtml(monthValue)}" onchange="window.attendanceReportMonth=this.value;renderAttendance()"></div><div class="formrow"><label for="rekapClass">Kelas</label><select id="rekapClass" onchange="window.attendanceReportClass=this.value;renderAttendance()"><option ${chosenClass==='Semua kelas'?'selected':''}>Semua kelas</option>${classes.map(c=>`<option value="${escapeHtml(c)}" ${chosenClass===c?'selected':''}>${escapeHtml(c)}</option>`).join('')}</select></div></div><p class="muted">Rekap menghitung catatan pada bulan terpilih. Hari tanpa catatan tidak otomatis dianggap hadir atau alpa.</p></div>
  <div class="grid"><div class="tile"><h3>${rows.length}</h3><p>Siswa terdaftar/tercatat</p></div>${statusList.map(st=>`<div class="tile"><h3>${totals[st]}</h3><p>${st}</p></div>`).join('')}<div class="tile"><h3>${totals.totalAbsen}</h3><p>Total ketidakhadiran</p></div></div>
  <div class="tablewrap"><table><thead><tr><th>No.</th><th>Kelas</th><th>Nama Siswa</th><th>Hadir</th><th>Sakit</th><th>Izin</th><th>Alpa</th><th>Bolos</th><th>Total Absen</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${escapeHtml(r.klass)}</td><td>${escapeHtml(r.name)}</td><td>${r.Hadir}</td><td>${r.Sakit}</td><td>${r.Izin}</td><td>${r.Alpa}</td><td>${r.Bolos}</td><td><b>${r.totalAbsen}</b></td></tr>`).join('')||'<tr><td colspan="9">Belum ada data absensi untuk bulan dan kelas ini.</td></tr>'}</tbody></table></div>
  <div class="actions">${teacher?'<button class="btn green" onclick="exportMonthlyAttendance()">Unduh Rekap Excel</button><button class="btn secondary" onclick="exportAttendance()">Unduh Semua Data CSV</button>':''}<button class="btn secondary" onclick="setAttendanceView('classes')">Kembali ke Kelas</button></div>`;return;
 }
 if(!roster.length){box.innerHTML=`<div class="inline-form"><h3>Kelas</h3><p class="empty">Belum ada daftar siswa. ${teacher?'Klik “+ Tambah” untuk mengunggah file daftar siswa.':'Guru belum mengunggah daftar siswa.'}</p></div>`;return;}
 const classes=[...new Set(roster.map(s=>String(s.klass||'Belum ditentukan').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'id'));
 if(!window.attendanceSelectedClass||!classes.includes(window.attendanceSelectedClass)){window.attendanceSelectedClass='';}
 if(!window.attendanceSelectedClass){box.innerHTML=`<h3>Kelas</h3><p class="muted">Pilih kelas untuk melihat daftar siswa dan absensinya.</p><div class="grid">${classes.map(c=>`<button class="tile" onclick="setAttendanceView('class',${escapeHtml(JSON.stringify(c))})"><div class="emoji">🏫</div><h3>${escapeHtml(c)}</h3><p>${roster.filter(s=>String(s.klass)===c).length} siswa</p><span class="btn secondary small-btn">Buka absensi</span></button>`).join('')}</div>${teacher?'<div class="actions"><button class="btn secondary" onclick="setAttendanceView(\'add\')">+ Tambah daftar / kelas dari file</button><button class="btn secondary" onclick="exportAttendance()">Unduh Rekap CSV</button></div>':''}`;return;}
 const klass=window.attendanceSelectedClass,students=roster.filter(s=>String(s.klass)===klass),records=getAttendance().filter(x=>x.date===date&&String(x.klass)===klass);
 box.innerHTML=`<div class="actions"><button class="btn secondary" onclick="setAttendanceView('classes')">← Kembali ke Kelas</button><h3 style="margin:0">Kelas ${escapeHtml(klass)}</h3></div><div class="inline-form"><div class="formrow"><label for="attDate">Tanggal absensi</label><input id="attDate" type="date" value="${escapeHtml(date)}" onchange="renderAttendance()"></div><p class="pill-note">Pilih status pada baris siswa. Status tersimpan untuk tanggal yang dipilih.</p></div><div class="tablewrap"><table><thead><tr><th>No.</th><th>Nama Siswa</th><th>Status</th>${teacher?'<th>Absensi</th><th>Data</th>':''}</tr></thead><tbody>${students.map((st,i)=>{const rec=records.find(x=>x.name.toLowerCase()===st.name.toLowerCase());const active=rec?rec.status:'Belum diabsen';return `<tr><td>${i+1}</td><td><strong>${escapeHtml(st.name)}</strong></td><td><span class="tag">${escapeHtml(active)}</span></td>${teacher?`<td><div class="actions">${['Hadir','Sakit','Izin','Alpa','Bolos'].map(status=>`<button class="btn ${active===status?'':'secondary'} small-btn" onclick="markStudentAttendance('${String(st.id).replace(/'/g,'')}','${status}')">${status}</button>`).join('')}</div></td><td><button class="btn secondary small-btn" onclick="editRosterStudent('${String(st.id).replace(/'/g,'')}')">Edit</button></td>`:''}</tr>`;}).join('')}</tbody></table></div>${teacher?`<div class="actions"><button class="btn green" onclick="addRosterStudentToClass(${escapeHtml(JSON.stringify(klass))})">+ Tambah Siswa ke Kelas Ini</button><button class="btn secondary" onclick="exportAttendance()">Unduh Rekap CSV</button></div>`:''}`;
}
function addRosterStudentToClass(klass){if(!currentUser||currentUser.role!=='guru')return;const name=prompt('Nama siswa baru:');if(name===null)return;const clean=name.trim();if(!clean){alert('Nama siswa tidak boleh kosong.');return;}const roster=getAttendanceRoster();if(roster.some(s=>s.name.toLowerCase()===clean.toLowerCase()&&String(s.klass)===String(klass))){alert('Siswa sudah terdaftar di kelas ini.');return;}roster.push({id:'stu-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),name:clean,klass});localStorage.setItem('ips_attendance_roster',JSON.stringify(roster));renderAttendance();}

function exportAttendance(){if(!currentUser||currentUser.role!=='guru')return;const arr=getAttendance();if(!arr.length){alert('Belum ada data absensi untuk diunduh.');return;}const csv=['Tanggal,Nama,Kelas,Status',...arr.map(x=>[x.date,x.name,x.klass,x.status].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));a.download='rekap-absensi-ips.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
async function importAttendanceCSV(){if(!currentUser||currentUser.role!=='guru')return;const file=$('attendanceUpload')?.files[0];if(!file)return;alert('Impor CSV lama digantikan dengan fitur “Muat Daftar Siswa” di atas. Unggah CSV daftar siswa pada bagian tersebut.');}
async function uploadAttendanceFile(){if(!currentUser||currentUser.role!=='guru'){alert('Hanya guru yang dapat mengunggah berkas.');return;}const input=$('attendanceFileUpload'),file=input&&input.files&&input.files[0];if(!file){alert('Pilih file Excel atau PDF terlebih dahulu.');return;}const ext=file.name.split('.').pop().toLowerCase();if(!['xlsx','xls','pdf'].includes(ext)){alert('Format yang didukung: .xlsx, .xls, atau .pdf');return;}if(file.size>25*1024*1024){alert('Ukuran berkas maksimal 25 MB.');return;}try{const db=await openMaterialDB();const item={key:'attendance-file:'+Date.now()+':'+file.name,id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),subject:'attendance_file',name:file.name,type:file.type|| (ext==='pdf'?'application/pdf':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'),size:file.size,uploadedAt:new Date().toISOString(),blob:file};await new Promise((resolve,reject)=>{const tx=db.transaction(MATERIAL_STORE,'readwrite');tx.objectStore(MATERIAL_STORE).put(item);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('Gagal menyimpan berkas'));});db.close();$('attMessage').innerHTML='<p class="status">Berkas berhasil diunggah dan tersedia pada daftar berkas absensi.</p>';input.value='';renderAttendanceFiles();}catch(err){console.error(err);alert('Berkas gagal disimpan. Coba gunakan browser terbaru dan pastikan ruang penyimpanan tersedia.');}}
async function getAttendanceFiles(){try{const db=await openMaterialDB();const items=await new Promise((resolve,reject)=>{const tx=db.transaction(MATERIAL_STORE,'readonly'),req=tx.objectStore(MATERIAL_STORE).getAll();req.onsuccess=()=>resolve(req.result.filter(x=>x.subject==='attendance_file'));req.onerror=()=>reject(req.error);});db.close();return items.sort((a,b)=>String(b.uploadedAt).localeCompare(String(a.uploadedAt)));}catch(e){console.warn(e);return[];}}
async function renderAttendanceFiles(){const box=$('attendanceFiles');if(!box)return;const files=await getAttendanceFiles();if(!box.isConnected)return;if(!files.length){box.innerHTML='<p class="empty">Belum ada berkas absensi yang diunggah guru.</p>';return;}const teacher=currentUser&&currentUser.role==='guru';box.innerHTML=`<div class="file-list">${files.map(f=>`<div class="file-item"><div><strong>${escapeHtml(f.name)}</strong><div class="muted">${escapeHtml(new Date(f.uploadedAt).toLocaleString('id-ID'))} • ${(f.size/1024/1024).toFixed(2)} MB</div></div><div class="actions"><button class="btn secondary small-btn" onclick="openAttendanceFile('${f.id}')">${f.name.toLowerCase().endsWith('.pdf')?'Buka PDF':'Unduh Excel'}</button>${teacher?`<button class="btn danger small-btn" onclick="deleteAttendanceFile('${f.id}')">Hapus</button>`:''}</div></div>`).join('')}</div>`;}
async function openAttendanceFile(id){const files=await getAttendanceFiles(),f=files.find(x=>String(x.id)===String(id));if(!f)return;const url=URL.createObjectURL(f.blob);if(f.name.toLowerCase().endsWith('.pdf')){const w=window.open(url,'_blank');if(!w){const a=document.createElement('a');a.href=url;a.download=f.name;a.click();}setTimeout(()=>URL.revokeObjectURL(url),60000);}else{const a=document.createElement('a');a.href=url;a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);}}
async function deleteAttendanceFile(id){if(!currentUser||currentUser.role!=='guru')return;if(!confirm('Hapus berkas absensi ini?'))return;try{const db=await openMaterialDB();await new Promise((resolve,reject)=>{const tx=db.transaction(MATERIAL_STORE,'readwrite');const all=tx.objectStore(MATERIAL_STORE).getAll();all.onsuccess=()=>{const item=all.result.find(x=>x.subject==='attendance_file'&&String(x.id)===String(id));if(item)tx.objectStore(MATERIAL_STORE).delete(item.key);};tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});db.close();renderAttendanceFiles();}catch(e){alert('Berkas tidak berhasil dihapus.');}}
function clearAttendance(){if(!currentUser||currentUser.role!=='guru')return;if(confirm('Yakin ingin menghapus semua data absensi di browser ini?')){localStorage.removeItem('ips_attendance');renderAttendance();}}
function getMedia(type){return JSON.parse(localStorage.getItem('ips_media_'+type)||'[]')}
function openMedia(type){
 if(!requireLogin())return;
 const p=$('contentPanel'),teacher=currentUser.role==='guru',isVideo=type==='video',title=isVideo?'Video Pembelajaran':'Infografik',arr=getMedia(type);
 p.classList.remove('hidden');
 p.innerHTML=`<h2>${isVideo?'🎬':'🗺️'} ${title}</h2><p class="muted">${isVideo?'Kumpulan video pendukung pembelajaran IPS.':'Kumpulan infografik dan ringkasan visual materi IPS.'}</p>
 ${teacher?`<div class="inline-form"><h3>Tambah ${title}</h3><div class="formrow"><label for="mediaTitle">Judul</label><input id="mediaTitle" placeholder="Judul ${title.toLowerCase()}"></div><div class="formrow"><label for="mediaUrl">Tautan ${isVideo?'video (YouTube)':'gambar atau infografik'}</label><input id="mediaUrl" type="url" placeholder="${isVideo?'https://www.youtube.com/watch?v=...':'https://alamat-gambar-infografik...'}"></div><div class="formrow"><label for="mediaDesc">Keterangan (opsional)</label><textarea id="mediaDesc" rows="2" placeholder="Deskripsi singkat"></textarea></div><button class="btn" onclick="saveMedia('${type}')">Simpan</button></div>`:''}
 <div class="grid">${arr.length?arr.map((m,i)=>`<article class="tile"><div class="emoji">${isVideo?'▶️':'🖼️'}</div><h3>${escapeHtml(m.title)}</h3><p>${escapeHtml(m.desc||'')}</p>${isVideo&&m.url.includes('youtube.com/watch')?`<a class="btn" target="_blank" rel="noopener" href="${escapeHtml(m.url)}">Tonton video</a>`:isVideo&&m.url.includes('youtu.be/')?`<a class="btn" target="_blank" rel="noopener" href="${escapeHtml(m.url)}">Tonton video</a>`:!isVideo?`<a class="btn" target="_blank" rel="noopener" href="${escapeHtml(m.url)}">Buka infografik</a>`:`<a class="btn" target="_blank" rel="noopener" href="${escapeHtml(m.url)}">Buka tautan</a>`}${teacher?` <button class="btn danger small-btn" onclick="deleteMedia('${type}',${i})">Hapus</button>`:''}</article>`).join(''):'<p class="empty">Belum ada konten. Guru dapat menambahkan tautan melalui formulir di atas.</p>'}</div><div class="actions"><button class="btn secondary" onclick="closeContent()">Kembali ke menu</button></div>`;
 p.scrollIntoView({behavior:'smooth',block:'start'});
}
function saveMedia(type){if(!currentUser||currentUser.role!=='guru')return;const title=$('mediaTitle').value.trim(),url=$('mediaUrl').value.trim(),desc=$('mediaDesc').value.trim();if(!title||!url){alert('Judul dan tautan wajib diisi.');return;}try{new URL(url)}catch(e){alert('Masukkan tautan lengkap yang valid.');return;}const arr=getMedia(type);arr.push({title,url,desc});localStorage.setItem('ips_media_'+type,JSON.stringify(arr));openMedia(type);}
function deleteMedia(type,index){if(!currentUser||currentUser.role!=='guru')return;if(!confirm('Hapus konten ini?'))return;const arr=getMedia(type);arr.splice(index,1);localStorage.setItem('ips_media_'+type,JSON.stringify(arr));openMedia(type);}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function closeContent(){$('contentPanel').classList.add('hidden');$('dashboard').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});}
</script>
</body>
</html>
